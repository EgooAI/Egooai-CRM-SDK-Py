[project]
name = "egooai-crm-sdk-py"
version = "0.1.0"
description = "Local CRM SDK with SQLModel-based data layer and an agent tool-calling pipeline."
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "sqlalchemy>=2.0.51,<2.1.0",
    "sqlmodel>=0.0.39,<1.0.0",
]

[tool.poetry]
package-mode = false

[tool.uv]
package = false
